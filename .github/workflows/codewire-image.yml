# codewire: builds this fork's image for Codewire's analytics (see CODEWIRE.md).
# Multi-arch, pushed to ghcr.io/noeljackson/umami and referenced by digest,
# with BuildKit SBOM and provenance attestations and a keyless cosign
# signature. Only GITHUB_TOKEN; no stored secrets. Every action is pinned by
# commit SHA. The weekly run rebuilds on the same commit so fixed Alpine
# packages (apk upgrade) land without a source change.
name: Codewire image

on:
  push:
    branches: [codewire]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions: {}

concurrency:
  group: codewire-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
      # Keyless signing and BuildKit's attestations take an OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        id: tag
        run: |
          version="$(jq -r .version package.json)"
          case "$version" in (*[!0-9A-Za-z.-]*|'') echo "unexpected version" >&2; exit 1 ;; esac
          echo "tag=${version}-codewire.${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Codewire mounts its own (empty) GeoIP database; never download one.
          build-args: |
            SKIP_BUILD_GEO=1
          push: true
          tags: ghcr.io/noeljackson/umami:${{ steps.tag.outputs.tag }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$DIGEST" in (sha256:[0-9a-f]*) ;; (*) echo "no digest" >&2; exit 1 ;; esac
          cosign sign --yes "ghcr.io/noeljackson/umami@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "### ghcr.io/noeljackson/umami"
            echo "- digest: \`${DIGEST}\`"
            echo "- tag: \`${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
